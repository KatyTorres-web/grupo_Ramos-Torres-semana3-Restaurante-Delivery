<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumaq · Cocina peruana y delivery en Huancayo</title>

    <!-- Meta etiquetas SEO -->

    <meta
      name="description"
      content="Sumaq: restaurante de cocina peruana casera en Huancayo. Reserva tu mesa o pide delivery de lomo saltado, ají de gallina y ceviche. Sabor de casa a domicilio."
    />

    <meta
      name="keywords"
      content="restaurante Huancayo, delivery comida peruana, reservas restaurante, lomo saltado, ceviche, menú del día, Sumaq"
    />

    <meta
      name="author"
      content="Ramos Tacza Camilda y Torres Ambrosio Katherine Medally - Facultad de Ingeniería de Sistemas, UNCP"
    />

    <meta name="robots" content="index, follow" />

    <!-- Tipografías (vía <link>, no @import) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 (CSS) -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/style.css" />

    <!-- Tailwind CSS (Play CDN, solo para desarrollo) -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
        theme: {
          extend: {
            colors: {
              pino: "#14261F", // verde andino profundo
              crema: "#FBF6EC", // fondo cálido
              aji: "#E4A11B", // amarillo ají (acento)
              rocoto: "#B4321E", // rojo rocoto
              tinta: "#23201A", // texto
            },
          },
        },
      };
    </script>
  </head>

  <body>
    <!-- ===== Paso 2: Navbar Responsivo (Bootstrap + toque Tailwind) ===== -->

    <!-- Utilidades Tailwind: shadow-lg (sombra), py-3 (espaciado), backdrop-blur (desenfoque) -->

    <nav
      class="navbar navbar-expand-lg sticky-top shadow-lg py-3 backdrop-blur"
      style="background-color: rgba(251, 246, 236, 0.85)"
    >
      <div class="container">
        <a
          class="navbar-brand font-display fw-bold d-flex align-items-center gap-2"
          href="#inicio"
          style="color: var(--pino)"
        >
          <span aria-hidden="true">🍽️</span> Sumaq
        </a>

        <!-- Botón hamburguesa: funciona solo con el JS de Bootstrap -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul
            class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-1"
          >
            <li class="nav-item">
              <a class="nav-link link-sumaq" href="#inicio"> Inicio </a>
            </li>

            <!-- Menú desplegable (dropdown) -->
            <li class="nav-item dropdown">
              <a
                class="nav-link link-sumaq dropdown-toggle"
                href="#menu"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Menú

                <!-- Badge de notificación "Nuevo" -->
                <span
                  class="badge rounded-pill align-middle"
                  style="background-color: var(--rocoto)"
                >
                  Nuevo
                </span>
              </a>

              <ul class="dropdown-menu shadow-lg rounded-xl">
                <li>
                  <a class="dropdown-item" href="#menu"> Entradas </a>
                </li>

                <li>
                  <a class="dropdown-item" href="#menu"> Platos de fondo </a>
                </li>

                <li>
                  <a class="dropdown-item" href="#menu"> Postres </a>
                </li>

                <li>
                  <hr class="dropdown-divider" />
                </li>

                <li>
                  <a class="dropdown-item" href="#menu">
                    Bebidas y refrescos
                  </a>
                </li>
              </ul>
            </li>

            <li class="nav-item">
              <a class="nav-link link-sumaq" href="#reservas"> Reservas </a>
            </li>

            <li class="nav-item">
              <a class="nav-link link-sumaq" href="#reservas"> Delivery </a>
            </li>

            <!-- Botón de pedidos con badge de notificación (contador de carrito) -->
            <li class="nav-item ms-lg-2">
              <a
                class="btn btn-pino position-relative rounded-pill px-3"
                href="#menu"
              >
                Mi pedido

                <span
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                  style="background-color: var(--aji); color: var(--tinta)"
                >
                  3

                  <span class="visually-hidden"> platos en tu pedido </span>
                </span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Bootstrap 5.3.3 (JS bundle: incluye Popper para dropdown y navbar) -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
